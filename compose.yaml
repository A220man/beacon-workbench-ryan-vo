services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: beacon-backend
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=sqlite+aiosqlite:///./beacon.db
      - OIDC_ENABLED=true
      - OIDC_ISSUER_URL=http://keycloak:8080/realms/beacon
      - OIDC_CLIENT_ID=beacon-workbench
      - OIDC_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - OIDC_AUDIENCE=beacon-workbench-api
      - CORS_ORIGINS=["http://127.0.0.1:5173","http://localhost:5173","http://frontend:80"]
      - SECRET_KEY=${SECRET_KEY:-development-secret-key-change-in-production-min-32-chars}
      - DEBUG=true
    volumes:
      - beacon-backend-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - beacon-network
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://127.0.0.1:8000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: beacon-frontend
    ports:
      - "127.0.0.1:5173:80"
    networks:
      - beacon-network
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: beacon-keycloak
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USER=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_METRICS_ENABLED=true
      - KC_DB=dev-file
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - beacon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  beacon-backend-data:
  keycloak-data:

networks:
  beacon-network:
    driver: bridge